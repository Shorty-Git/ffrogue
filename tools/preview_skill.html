<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill composition review</title>
<style>body{background:#121d1c;color:#eee8d6;font:14px Arial;margin:0}main{max-width:1060px;margin:auto;padding:18px}h1{font-size:23px}p{line-height:1.45}button,select{background:#283b33;color:#eee8d6;padding:8px;border:1px solid #8a8066}#controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#frame{flex:1;min-width:160px}#preview{display:block;max-width:100%;max-height:calc(100vh - 260px);min-height:220px;width:auto;margin-top:12px;border:1px solid #665f4b}#status{color:#c5b480}small{color:#b4c0b2}</style>
<main><h1 id="title">Skill composition review</h1><p id="warning"></p><p id="status">Loading and rendering diagnostics…</p>
<div id="controls"><button id="play" disabled>Play</button><button id="restart" disabled>Restart</button><select id="arena" aria-label="Arena" disabled><option value="reactor">Reactor 01</option><option value="forest">Forest</option></select><select id="target" aria-label="Target row" disabled><option value="0">Upper target</option><option value="1" selected>Middle target</option><option value="2">Lower target</option></select><input id="frame" aria-label="Timeline frame" type="range" min="0" value="0" disabled><output id="tick">F0</output></div>
<canvas id="preview" width="1000" height="800"></canvas><p id="detail"></p><small>Candidate composition only. No HP changes, recoil or camera shake. No runtime content is published. Raw group placement fields remain unapplied; source rotation tuples are preview hypotheses.</small>
<script src="/sdk/Sample/three.min.js"></script><script src="/sdk/effekseer.js"></script><script>
(async()=>{
const cfg=await(await fetch('/config.json')).json(),canvas=document.querySelector('#preview'),paint=canvas.getContext('2d'),status=document.querySelector('#status'),arena=document.querySelector('#arena'),target=document.querySelector('#target'),frame=document.querySelector('#frame'),tick=document.querySelector('#tick');
target.hidden=cfg.scope!=='single_enemy';
const repaired=cfg.effects.some(e=>e.repairReason);document.querySelector('#title').textContent=cfg.name+(repaired?' · UV repair review':' · composition review');document.title=cfg.name+(repaired?' · UV repair preview':' · research preview');
document.querySelector('#warning').textContent='Source motion '+cfg.sourceMotionType+' → preview '+cfg.motion+' (explicit adaptation; mapping unverified). Source start ticks and hit weights are preserved. Original-game fidelity is not established.';frame.max=cfg.endFrame;
await new Promise((resolve,reject)=>effekseer.initRuntime('/sdk/effekseer.wasm',resolve,()=>reject(Error('SDK initialization failed'))));
const scene=new THREE.Scene(),layers={};
for(const key of ['back','front']){
 const gpu=document.createElement('canvas');gpu.width=1000;gpu.height=800;
 const renderer=new THREE.WebGLRenderer({canvas:gpu,alpha:true,premultipliedAlpha:false,preserveDrawingBuffer:true});renderer.setClearColor(0,0);
 const camera=new THREE.OrthographicCamera(-500,500,400,-400,.1,5000);camera.position.set(0,0,1000);camera.lookAt(new THREE.Vector3());camera.updateMatrixWorld();
 const context=effekseer.createContext();context.init(renderer.getContext());context.setCameraMatrix(camera.matrixWorldInverse.elements);
 layers[key]={gpu,renderer,camera,context,handles:[]};
}
const effects=[];
for(const member of cfg.effects){const layer=layers[member.layer];let effect;await new Promise((resolve,reject)=>{effect=layer.context.loadEffect(member.url,1,resolve,(m,u)=>reject(Error(m+' '+u)));});effects.push({...member,effect});}
const images={};for(const url of [cfg.actor.bodyUrl,cfg.actor.idleUrl,cfg.rat.url,...Object.values(cfg.arenas).map(a=>a.url)]){const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('Image failed '+url));im.src=url;});images[url]=im;}
const save=async(name,body)=>{const r=await fetch('/output/'+name,{method:'POST',body});if(!r.ok)throw Error('Save failed '+name);},blob=c=>new Promise(resolve=>c.toBlob(resolve));
function projection(layer,width){const c=layer.camera;c.left=-width/2;c.right=width/2;c.top=width*.4;c.bottom=-width*.4;c.updateProjectionMatrix();layer.context.setProjectionMatrix(c.projectionMatrix.elements);}
function draw(layer){layer.renderer.render(scene,layer.camera);layer.context.draw();layer.renderer.resetState();}
function spawn(member,x,y){const layer=layers[member.layer],h=layer.context.play(member.effect,x,y,0),s=member.scalePercent/100;h.setRandomSeed(cfg.seed);h.setScale(s,s,s);h.setRotation(...member.rotationDegrees.map(v=>v*Math.PI/180));layer.handles.push(h);}
function reset(width=1000){for(const layer of Object.values(layers)){layer.context.stopAll();layer.handles=[];projection(layer,width);}}
function update(){for(const layer of Object.values(layers))layer.context.update(1);}
function stats(layer){const c=document.createElement('canvas');c.width=1000;c.height=800;const p=c.getContext('2d');p.drawImage(layer.gpu,0,0);const d=p.getImageData(0,0,1000,800).data;let count=0,alpha=0,l=1000,t=800,r=-1,b=-1,edges=0;for(let y=0;y<800;y++)for(let x=0;x<1000;x++){const i=(y*1000+x)*4;if(d[i+3]>12)alpha++;if(Math.max(d[i],d[i+1],d[i+2])>12&&d[i+3]>12){count++;l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y);if(x<2||x>997||y<2||y>797)edges++;}}return {visiblePixels:count,alphaPixels:alpha,bounds:count?[l,t,r,b]:null,edgePixels:edges,alive:layer.handles.filter(h=>h.exists).length};}
function sprite(url,meta,index,x,y,scale){const im=images[url],cols=Math.floor(im.width/meta.frameWidth);paint.drawImage(im,index%cols*meta.frameWidth,Math.floor(index/cols)*meta.frameHeight,meta.frameWidth,meta.frameHeight,x-meta.pivotX*meta.frameWidth*scale,y-meta.pivotY*meta.frameHeight*scale,meta.frameWidth*scale,meta.frameHeight*scale);}
function pose(meta,f,loop=false){let elapsed=f*1000/60,total=meta.frames.reduce((s,v)=>s+v.durationMs,0);if(loop)elapsed%=total;for(let i=0;i<meta.frames.length;i++){elapsed-=meta.frames[i].durationMs;if(elapsed<0)return i;}return meta.frameCount-1;}
function points(member){const layout=cfg.arenas[arena.value].layout,all=['top','center','bottom'].map(key=>layout.enemies[key]).map(p=>({x:p.x,y:p.y-50})),targets=cfg.scope==='single_enemy'?[all[Number(target.value)]]:all;if(member.anchor==='target')return targets;if(member.anchor==='target-group')return [{x:targets.reduce((s,p)=>s+p.x,0)/targets.length,y:targets.reduce((s,p)=>s+p.y,0)/targets.length}];if(member.anchor==='caster'){const p=layout.party[cfg.character];return [{x:p.x,y:p.y-50}];}return [{x:500,y:400}];}
function scheduled(f){for(const member of effects)if(member.startFrame===f)for(const p of points(member))spawn(member,p.x-500,400-p.y);}
function compose(f){const a=cfg.arenas[arena.value],layout=a.layout,b=layout.arena,im=images[a.url],scale=Math.max(b.width/im.width,b.height/im.height);paint.fillStyle='#14201d';paint.fillRect(0,0,1000,800);paint.save();paint.beginPath();paint.rect(b.x,b.y,b.width,b.height);paint.clip();paint.drawImage(im,(1000-im.width*scale)/2,b.y+(b.height-im.height*scale)/2,im.width*scale,im.height*scale);paint.restore();
 paint.drawImage(layers.back.gpu,0,0);
 const p=layout.party[cfg.character],total=cfg.actor.body.frames.reduce((s,v)=>s+v.durationMs,0),rest=f*1000/60>=total;
 const actors=[...Object.values(layout.enemies).map(p=>({y:p.y,draw:()=>sprite(cfg.rat.url,cfg.rat.body,pose(cfg.rat.body,f,true),p.x,p.y,cfg.rat.scale)})),{y:p.y,draw:()=>sprite(rest?cfg.actor.idleUrl:cfg.actor.bodyUrl,rest?cfg.actor.idle:cfg.actor.body,pose(rest?cfg.actor.idle:cfg.actor.body,f,rest),p.x,p.y,cfg.actor.scale)}];actors.sort((a,b)=>a.y-b.y).forEach(a=>a.draw());
 paint.save();paint.globalCompositeOperation='lighter';paint.drawImage(layers.front.gpu,0,0);paint.restore();paint.fillStyle='#eee8d6';paint.font='17px Arial';paint.fillText(cfg.name+' · OFFLINE CANDIDATE · F'+f+' / '+(f*1000/60).toFixed(1)+' ms',15,28);const hit=cfg.hits.find(h=>h.frame===f);if(hit)paint.fillText('Source hit: '+hit.weight+'% per target',650,28);frame.value=f;tick.textContent='F'+f;document.querySelector('#detail').textContent=cfg.effects.map(m=>m.originalFile+' F'+m.startFrame+' / '+m.anchor+' / '+m.layer+' / rotation '+m.rotationDegrees.join(',')).join(' · ')+' · Raw placement fields stay unapplied. No gameplay damage.';
}
function contact(){const c=document.createElement('canvas');c.width=1000;c.height=880;const p=c.getContext('2d');p.fillStyle='#17221f';p.fillRect(0,0,1000,880);return {canvas:c,paint:p};}
function tile(sheet,source,index,label){sheet.paint.drawImage(source,index%4*250,Math.floor(index/4)*220,250,200);sheet.paint.fillStyle='#eee8d6';sheet.paint.font='12px Arial';sheet.paint.fillText(label,index%4*250+5,Math.floor(index/4)*220+215);}
const result={approved:false,character:cfg.character,skill:cfg.skill,interpretation:cfg.interpretation,individuals:[],composites:[]};
const individualSamples=[0,1,20,40,60,90,120,150,180,240,300,420];
for(const member of effects){status.textContent='Rendering '+member.originalFile+'…';reset(4096);spawn(member,0,0);const sheet=contact(),measurements=[];for(let f=0;f<=cfg.endFrame;f++){update();if(individualSamples.includes(f)){const layer=layers[member.layer];draw(layer);tile(sheet,layer.gpu,individualSamples.indexOf(f),'Effect '+member.effectId+' · F'+f);measurements.push({frame:f,...stats(layer)});}}await save('effect-'+member.effectId+'.png',await blob(sheet.canvas));result.individuals.push({id:member.effectId,rotation:member.rotationDegrees,scale:member.scalePercent/100,cameraWidth:4096,measurements});await new Promise(requestAnimationFrame);}
const hitFrames=cfg.hits.map(h=>h.frame),samples=[...new Set([0,...effects.map(m=>m.startFrame),90,hitFrames[0],hitFrames[Math.floor(hitFrames.length/2)],hitFrames.at(-1),245,300,cfg.endFrame])].filter(Number.isFinite).sort((a,b)=>a-b);
for(const key of Object.keys(cfg.arenas))for(const row of (cfg.scope==='single_enemy'?[0,1,2]:[1])){arena.value=key;target.value=String(row);reset();const sheet=contact(),measurements=[];for(let f=0;f<=cfg.endFrame;f++){scheduled(f);update();if(samples.includes(f)){for(const layer of Object.values(layers))draw(layer);compose(f);tile(sheet,canvas,samples.indexOf(f),key+' · F'+f);measurements.push({frame:f,back:stats(layers.back),front:stats(layers.front)});}}const rowName=['upper','middle','lower'][row];await save(key+(cfg.scope==='single_enemy'?'-'+rowName:'')+'.png',await blob(sheet.canvas));result.composites.push({arena:key,targetRow:cfg.scope==='single_enemy'?rowName:'all',samples,measurements});await new Promise(requestAnimationFrame);}
await save('results.json',JSON.stringify(result,null,2));
let current=-1,playing=false,last=0,carry=0;
function seek(f){reset();current=-1;advance(f);}
function advance(f){while(current<f){current++;scheduled(current);update();}for(const layer of Object.values(layers))draw(layer);compose(f);}
arena.value='reactor';target.value='1';seek(hitFrames.at(-1)??90);status.textContent='Review ready: all source members and both arena compositions rendered'+(cfg.scope==='single_enemy'?' across all three target rows':'')+'. Not published.';
for(const element of document.querySelectorAll('button,input,select'))element.disabled=false;
const play=document.querySelector('#play');play.onclick=()=>{playing=!playing;last=0;carry=0;if(playing&&current>=cfg.endFrame)seek(0);play.textContent=playing?'Pause':'Play';};
document.querySelector('#restart').onclick=()=>{playing=false;play.textContent='Play';seek(0);};frame.oninput=()=>{playing=false;play.textContent='Play';seek(Number(frame.value));};arena.onchange=()=>seek(Number(frame.value));target.onchange=()=>seek(Number(frame.value));
function loop(time){if(playing){if(last)carry+=time-last;while(carry>=1000/60&&current<cfg.endFrame){advance(current+1);carry-=1000/60;}if(current>=cfg.endFrame){playing=false;play.textContent='Play';}}last=time;requestAnimationFrame(loop);}requestAnimationFrame(loop);
})().catch(error=>{document.querySelector('#status').textContent='ERROR: '+error.message;console.error(error);});
</script></main></html>
