<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Native pixel clip review</title>
<style>
body{margin:0;background:#10141d;color:#e7edf6;font:15px system-ui}main{max-width:1100px;margin:24px auto;padding:0 20px}h1{font-size:23px;margin:0 0 8px}p{color:#aab9cc}section{display:flex;gap:24px;align-items:flex-start}canvas{width:405px;max-width:60vw;height:auto;border:1px solid #39475c}aside{max-width:430px}button,select,input{margin:8px 6px 8px 0;padding:8px;background:#243247;color:white;border:1px solid #4d6584;border-radius:4px}input{width:90%}pre{white-space:pre-wrap;font-size:12px}#status{color:#f1cc79}
</style>
<main><h1>Original renderer - exported pixel sequence</h1><p>Research review. One source effect; no reconstructed particle simulation runs in this browser.</p>
<section><canvas id="view"></canvas><aside><b id="identity">Loading...</b><p id="status"></p>
<button id="play">Play</button><select id="background"><option value="dark">Dark</option><option value="black">Black reference</option><option value="white">White reference</option><option value="checker">Checkerboard - unverified</option></select>
<button id="validate">Compare browser with native references</button>
<div><input type="range" id="frame" min="0" value="0"><span id="tick"></span></div>
<label><input type="checkbox" id="native" style="width:auto">Show native reference instead of browser composition</label>
<p>Position and dimensions come from the captured native viewport. Canvas display is scaled uniformly to fit.</p><pre id="details"></pre></aside></section></main>
<script type="module">
const clip=await(await fetch('/clip.json')).json(),canvas=document.querySelector('#view'),slider=document.querySelector('#frame'),bg=document.querySelector('#background');
canvas.width=clip.size[0];canvas.height=clip.size[1];slider.max=clip.frames.length-1;
document.querySelector('#identity').textContent=clip.source;
document.querySelector('#status').textContent=clip.nativeReferenceChecksPassed?'Offline black/white comparison passed. Browser comparison pending.':'Experimental: native-reference comparison has differences.';
document.querySelector('#details').textContent=clip.timing+'\n\n'+clip.timingLimit+'\n\n'+clip.limitations.join('\n');
const gl=canvas.getContext('webgl',{alpha:false,preserveDrawingBuffer:true,antialias:false});if(!gl)throw Error('WebGL unavailable');
function shader(type,text){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;attribute vec2 uv;varying vec2 v;void main(){v=uv;gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 v;uniform sampler2D image;uniform int backdrop;void main(){if(backdrop==0){gl_FragColor=texture2D(image,v);}else if(backdrop==1){gl_FragColor=vec4(0.,0.,0.,1.);}else if(backdrop==2){gl_FragColor=vec4(1.);}else if(backdrop==3){float c=mod(floor(v.x*12.)+floor(v.y*21.),2.);gl_FragColor=vec4(vec3(mix(.15,.65,c)),1.);}else{gl_FragColor=vec4(.035,.065,.12,1.);}}'));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);for(const [name,offset]of [['p',0],['uv',8]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,16,offset);}
const backdrop=gl.getUniformLocation(program,'backdrop');gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
const textures=new Map();async function texture(name,size){if(textures.has(name))return textures.get(name);
const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
if(name.endsWith('.rgba')){const bytes=new Uint8Array(await(await fetch('/'+name)).arrayBuffer());if(bytes.length!==size[0]*size[1]*4)throw Error('Layer size differs');gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,size[0],size[1],0,gl.RGBA,gl.UNSIGNED_BYTE,bytes);}
else{const image=new Image();image.src='/'+name;await image.decode();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);}
textures.set(name,t);return t;}
await Promise.all(clip.frames.flatMap(f=>f.layers).map(l=>texture(l.file,[l.box[2]-l.box[0],l.box[3]-l.box[1]])));
function quad(box){const [x,y,r,b]=box,w=canvas.width,h=canvas.height,l=x/w*2-1,rr=r/w*2-1,t=1-y/h*2,bb=1-b/h*2;gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([l,t,0,0,rr,t,1,0,l,bb,0,1,l,bb,0,1,rr,t,1,0,rr,bb,1,1]),gl.STREAM_DRAW);gl.drawArrays(gl.TRIANGLES,0,6);}
let playing=false,start=0,startTick=0,renderVersion=0;
async function render(){const version=++renderVersion,f=clip.frames[Number(slider.value)];gl.disable(gl.BLEND);gl.uniform1i(backdrop,{black:1,white:2,checker:3,dark:4}[bg.value]);quad([0,0,...clip.size]);
if(document.querySelector('#native').checked&&['black','white'].includes(bg.value)&&f.layers.length){const t=await texture('f'+f.tick+'-native-'+bg.value+'.png');if(version!==renderVersion)return;gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(backdrop,0);quad([0,0,...clip.size]);}
else{gl.uniform1i(backdrop,0);gl.enable(gl.BLEND);gl.blendEquation(gl.FUNC_ADD);for(const layer of f.layers){gl.blendFunc(gl.ONE,layer.mode==='add'?gl.ONE:gl.ONE_MINUS_SRC_ALPHA);gl.bindTexture(gl.TEXTURE_2D,textures.get(layer.file));quad(layer.box);}}
document.querySelector('#tick').textContent=clip.sampleKind+' '+f.tick;globalThis.liveClipReview={ready:true,index:Number(slider.value),tick:f.tick,glError:gl.getError(),width:canvas.width,height:canvas.height};}
slider.oninput=()=>{playing=false;render();};bg.onchange=render;document.querySelector('#native').onchange=render;
document.querySelector('#play').onclick=()=>{playing=!playing;start=performance.now();startTick=clip.frames[Number(slider.value)].tick;};
function animate(now){if(playing){const first=clip.frames[0].tick,last=clip.frames.at(-1).tick,step=clip.frames.length>1?clip.frames[1].tick-first:1;const tick=first+(startTick-first+(now-start)*clip.ticksPerSecond/1000)%(last-first+step);let i=clip.frames.findLastIndex(f=>f.tick<=tick);if(i!==Number(slider.value)){slider.value=i;render();}}requestAnimationFrame(animate);}render();requestAnimationFrame(animate);
globalThis.setLiveClipFrame=async(index,background='black',native=false)=>{playing=false;slider.value=index;bg.value=background;document.querySelector('#native').checked=native;await render();};
document.querySelector('#validate').onclick=async()=>{playing=false;const results={};for(const background of ['black','white']){
bg.value=background;document.querySelector('#native').checked=false;await render();const actual=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,actual);
document.querySelector('#native').checked=true;await render();const reference=new Uint8Array(actual.length);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,reference);
let max=0,pixelsAbove3=0;for(let i=0;i<actual.length;i+=4){let pixelMax=0;for(let c=0;c<3;c++)pixelMax=Math.max(pixelMax,Math.abs(actual[i+c]-reference[i+c]));max=Math.max(max,pixelMax);if(pixelMax>3)pixelsAbove3++;}results[background]={max,pixelsAbove3};}
document.querySelector('#native').checked=false;await render();document.querySelector('#status').textContent='Actual WebGL/native comparison: '+JSON.stringify(results);globalThis.liveClipReview.comparison=results;};
</script></html>
